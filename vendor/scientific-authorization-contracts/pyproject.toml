[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-authorization-contracts"
version = "2.2.0"
description = "Shared scientific authorization envelope schemas, vocabularies, and algebra"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SCOPE Contributors" }]
keywords = ["authorization", "scientific-review", "scope", "akta"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/fraware/SCOPE"
Repository = "https://github.com/fraware/SCOPE"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scientific_authorization_contracts = [
    "schemas/*.json",
    "vocabularies/*.json",
    "conformance/**/*.json",
    "py.typed",
]
