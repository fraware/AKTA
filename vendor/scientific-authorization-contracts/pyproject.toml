[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "scientific-authorization-contracts"
version = "2.1.0"
description = "Shared scientific authorization envelope, grant, and status contracts for SCOPE and AKTA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SCOPE/AKTA Contributors" }]
keywords = ["authorization", "scientific-action", "capability-envelope"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/scientific-authorization/contracts"

[tool.hatch.build.targets.wheel]
packages = ["python/scientific_authorization_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "scientific_authorization_contracts/schemas"
"vocabularies" = "scientific_authorization_contracts/vocabularies"
"conformance" = "scientific_authorization_contracts/conformance"

[tool.hatch.build.targets.sdist]
include = [
    "python/scientific_authorization_contracts",
    "schemas",
    "vocabularies",
    "conformance",
    "README.md",
    "pyproject.toml",
]
