version: akta-scope-policy-manifest-signer-keys-v1
description: |
  Approved public keys for SCOPE authorization-policy manifest signatures (AKTA 1.1).

  Separate trust domain from grant issuers and status attestors.
  Wired for verification in Phase B (WS5). Ships EMPTY.

default_authorized_artifact_types:
  - scope_authorization_manifest

schema:
  entry_required:
    - key_id
    - status
    - algorithm
  entry_public_material_one_of:
    - public_key_ref
    - public_key_pem
    - public_key_file
  status_enum:
    - active
    - revoked
    - expired
    - pending
  algorithm_enum:
    - Ed25519
  optional_fields:
    - valid_from
    - valid_until
    - issuer_identity
    - tenant
    - institution
    - authorized_artifact_types
    - replacement_key_id
    - revocation_reason
    - notes

signers: {}

revoked_key_ids: []
