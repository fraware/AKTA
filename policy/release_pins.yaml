# Institutional full-stack release pins (P1-A / WS12 / AKTA 1.2 P0-12).
# Recorded SHAs are discovery-time pins from sibling checkouts / public remotes.
# Missing checkouts or SHA mismatches remain fail-closed under
# institutional_release — never silently optionalized.
#
# Checkout existence alone is insufficient: akta.release_pins / sibling_repos
# compare `git rev-parse HEAD` to the pinned commit, require a clean working
# tree, resolve declared tags to the pin, and check submodule HEADs.
#
# SCOPE 2.2 + contracts 2.2 co-release: do not invent sibling commit SHAs.
# Current component commits are real discovery pins with extended verification.
# shared_contracts wheel_sha256 + source_archive_sha256 are real 2.2.0 digests;
# release_manifest_sha256 uses contracts_package_content_hash (unsigned content
# identity). release_signer remains PLACEHOLDER until signing keys publish.
#
# Beta: pins enable reproducible institutional validation; they do not certify
# production readiness for SCOPE-authorized action.

version: akta-release-pins-v1.2
profile: institutional_release
recorded_at: "2026-07-23T16:40:00Z"
recorded_host: local-discovery
target_ecosystem:
  akta: "1.2.0"
  scope: "2.2"  # pending canonical co-release; component commits remain current discovery pins
  contracts: "2.2.0"  # wheel SHA pinned; signed release manifest/signer still pending

