# Institutional full-stack release pins (P1-A / WS12).
# Recorded SHAs are discovery-time pins from sibling checkouts / public remotes.
# Missing checkouts or SHA mismatches remain fail-closed under
# institutional_release — never silently optionalized.
#
# Checkout existence alone is insufficient: akta.release_pins / sibling_repos
# compare `git rev-parse HEAD` to the pinned commit.
#
# Beta: pins enable reproducible institutional validation; they do not certify
# production readiness for SCOPE-authorized action.

