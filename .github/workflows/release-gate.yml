name: Release Gate

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  scope-live-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Clone trust-stack siblings
        uses: ./.github/actions/clone-siblings
        with:
          workspace: ${{ github.workspace }}
          scope_repo_url: ${{ secrets.SCOPE_REPO_URL || vars.SCOPE_PUBLIC_REPO_URL || 'https://github.com/fraware/SCOPE.git' }}
          pf_core_repo_url: ${{ secrets.PF_CORE_REPO_URL || vars.PF_CORE_PUBLIC_REPO_URL }}
          pcs_core_repo_url: ${{ secrets.PCS_CORE_REPO_URL || vars.PCS_CORE_PUBLIC_REPO_URL }}
          pcs_bench_repo_url: ${{ secrets.PCS_BENCH_REPO_URL || vars.PCS_BENCH_PUBLIC_REPO_URL }}
          vsa_repo_url: ${{ secrets.VSA_REPO_URL || vars.VSA_PUBLIC_REPO_URL }}
          memory_repo_url: ${{ secrets.MEMORY_REPO_URL || vars.MEMORY_PUBLIC_REPO_URL }}
      - name: Install dependencies
        run: |
          pip install ./vendor/scientific-authorization-contracts
          pip install -e ".[dev,security]"
      - name: Require SCOPE sibling path
        run: |
          if [ -z "${SCOPE_REPO_PATH:-}" ]; then
            echo "FAIL: SCOPE_REPO_PATH not set after clone (release gate requires live SCOPE)"
            exit 1
          fi
      - name: Shared contract drift gate (require SCOPE sibling)
        env:
          SCOPE_REPO_PATH: ${{ env.SCOPE_REPO_PATH }}
        run: python scripts/assert_shared_contract_drift.py --require-sibling
      - name: Sync SCOPE contract fixtures
        env:
          SCOPE_REPO_PATH: ${{ env.SCOPE_REPO_PATH }}
        run: python scripts/sync_scope_contract_fixtures.py --scope-repo "$SCOPE_REPO_PATH"
      - name: Install SCOPE package for CLI modes
        env:
          SCOPE_REPO_PATH: ${{ env.SCOPE_REPO_PATH }}
        run: |
          if [ -n "${SCOPE_REPO_PATH:-}" ] && [ -f "$SCOPE_REPO_PATH/pyproject.toml" ]; then
            pip install -e "$SCOPE_REPO_PATH"
          else
            echo "WARN: SCOPE_REPO_PATH missing pyproject.toml; CLI install skipped"
          fi
      - name: Native SCOPE interop (wheel install + acceptance)
        env:
          SCOPE_REPO_PATH: ${{ env.SCOPE_REPO_PATH }}
          AKTA_REQUIRE_NATIVE_SCOPE: "1"
          AKTA_RELEASE_GATE: "1"
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          set -euo pipefail
          # Steps 1–3: install pinned contract / SCOPE / AKTA wheels into clean venv
          python -m build
          python -m venv /tmp/akta-native-scope
          /tmp/akta-native-scope/bin/pip install --upgrade pip
          /tmp/akta-native-scope/bin/pip install ./vendor/scientific-authorization-contracts
          /tmp/akta-native-scope/bin/pip install -e "$SCOPE_REPO_PATH"
          /tmp/akta-native-scope/bin/pip install dist/*.whl
          /tmp/akta-native-scope/bin/pip install hypothesis pytest pyyaml
          cp -a policy overlays /tmp/akta-native-scope/
          cd /tmp/akta-native-scope
          # Steps 4–14 via wheel smoke native phase (real SCOPE APIs, no invented fields)
          SCOPE_REPO_PATH="$SCOPE_REPO_PATH" AKTA_REQUIRE_NATIVE_SCOPE=1 \
            ./bin/python -m akta.wheel_smoke
          # Required acceptance scenario
          cd "${{ github.workspace }}"
          SCOPE_REPO_PATH="$SCOPE_REPO_PATH" AKTA_REQUIRE_NATIVE_SCOPE=1 AKTA_RELEASE_GATE=1 \
            /tmp/akta-native-scope/bin/python -m pytest tests/test_native_scope_acceptance_1_2.py -v
      - name: SCOPE live chain (python-import)
        env:
          SCOPE_REPO_PATH: ${{ env.SCOPE_REPO_PATH }}
        run: python scripts/verify_scope_live_chain.py --scope-repo "$SCOPE_REPO_PATH" --mode python-import
      - name: SCOPE live chain (cli)
        env:
          SCOPE_CLI: scope
          AKTA_REQUIRE_SCOPE_CLI: ${{ vars.AKTA_REQUIRE_SCOPE_CLI || '1' }}
        run: |
          if ! command -v scope >/dev/null 2>&1; then
            if [ "${AKTA_REQUIRE_SCOPE_CLI}" = "1" ]; then
              echo "FAIL: scope CLI required on release gate but not installed"
              exit 1
            fi
            echo "WARN: scope CLI not installed; skipping CLI mode"
            exit 0
          fi
          python scripts/verify_scope_live_chain.py --mode cli
      - name: SCOPE live chain (akta-review)
        env:
          SCOPE_CLI: scope
          SCOPE_CLI_MODE: akta-review
          AKTA_REQUIRE_SCOPE_CLI: ${{ vars.AKTA_REQUIRE_SCOPE_CLI || '1' }}
        run: |
          if ! command -v scope >/dev/null 2>&1; then
            if [ "${AKTA_REQUIRE_SCOPE_CLI}" = "1" ]; then
              echo "FAIL: scope CLI required on release gate but not installed"
              exit 1
            fi
            echo "WARN: scope CLI not installed; skipping akta-review mode"
            exit 0
          fi
          python scripts/verify_scope_live_chain.py --mode akta-review
      - name: Pilot bundle generate and verify
        env:
          SCOPE_REPO_PATH: ${{ env.SCOPE_REPO_PATH }}
        run: |
          make demo-pilot-bundle
          make verify-pilot-bundle
      - name: Strict SCOPE contract cross-repo demo
        env:
          SCOPE_REPO_PATH: ${{ env.SCOPE_REPO_PATH }}
          AKTA_STRICT_SCOPE_CONTRACT: "1"
        run: |
          make demo-reconstructable-cross-repo
          make verify-reconstructable-cross-repo
      - name: Upload pilot bundle artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: pilot-bundle
          path: dist/pilot_bundle/

  sibling-live-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Resolve sibling clone URLs (mandatory public fallbacks on tags)
        id: sibling_urls
        shell: bash
        run: |
          set -euo pipefail
          is_tag=0
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            is_tag=1
          fi
          echo "is_release_tag=${is_tag}" >> "$GITHUB_OUTPUT"

          pick() {
            local secret="$1" var="$2" public="$3"
            if [ -n "${secret}" ]; then echo "${secret}"; return; fi
            if [ -n "${var}" ]; then echo "${var}"; return; fi
            if [ "${is_tag}" = "1" ]; then echo "${public}"; return; fi
            echo ""
          }

          echo "pf_core_repo_url=$(pick '${{ secrets.PF_CORE_REPO_URL }}' '${{ vars.PF_CORE_PUBLIC_REPO_URL }}' 'https://github.com/SentinelOps-CI/provability-fabric-core.git')" >> "$GITHUB_OUTPUT"
          echo "pcs_core_repo_url=$(pick '${{ secrets.PCS_CORE_REPO_URL }}' '${{ vars.PCS_CORE_PUBLIC_REPO_URL }}' 'https://github.com/SentinelOps-CI/pcs-core.git')" >> "$GITHUB_OUTPUT"
          echo "pcs_bench_repo_url=$(pick '${{ secrets.PCS_BENCH_REPO_URL }}' '${{ vars.PCS_BENCH_PUBLIC_REPO_URL }}' 'https://github.com/fraware/pcs-bench.git')" >> "$GITHUB_OUTPUT"
          echo "vsa_repo_url=$(pick '${{ secrets.VSA_REPO_URL }}' '${{ vars.VSA_PUBLIC_REPO_URL }}' 'https://github.com/fraware/verified-science-agent.git')" >> "$GITHUB_OUTPUT"
          echo "memory_repo_url=$(pick '${{ secrets.MEMORY_REPO_URL }}' '${{ vars.MEMORY_PUBLIC_REPO_URL }}' 'https://github.com/fraware/scientific-memory.git')" >> "$GITHUB_OUTPUT"
      - name: Clone trust-stack siblings
        uses: ./.github/actions/clone-siblings
        with:
          workspace: ${{ github.workspace }}
          scope_repo_url: ${{ secrets.SCOPE_REPO_URL || vars.SCOPE_PUBLIC_REPO_URL || 'https://github.com/fraware/SCOPE.git' }}
          pf_core_repo_url: ${{ steps.sibling_urls.outputs.pf_core_repo_url }}
          pcs_core_repo_url: ${{ steps.sibling_urls.outputs.pcs_core_repo_url }}
          pcs_bench_repo_url: ${{ steps.sibling_urls.outputs.pcs_bench_repo_url }}
          vsa_repo_url: ${{ steps.sibling_urls.outputs.vsa_repo_url }}
          memory_repo_url: ${{ steps.sibling_urls.outputs.memory_repo_url }}
      - name: Install dependencies
        run: |
          pip install ./vendor/scientific-authorization-contracts
          pip install -e ".[dev,security]"
      - name: Require full sibling matrix on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          missing=()
          for var in SCOPE_REPO_PATH PF_CORE_REPO_PATH PCS_CORE_REPO_PATH PCS_BENCH_REPO_PATH VSA_REPO_PATH MEMORY_REPO_PATH; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "FAIL: release tag requires full sibling matrix; missing: ${missing[*]}"
            exit 1
          fi
          echo "Full sibling matrix present for release tag"
          python - <<'PY'
          from akta.release_pins import load_release_pins
          pins = load_release_pins()
          vsa = (pins.get("components") or {}).get("VSA") or {}
          commit = str(vsa.get("commit") or "")
          assert vsa.get("status") == "pinned", f"VSA status must be pinned, got {vsa.get('status')!r}"
          assert len(commit) == 40 and all(c in "0123456789abcdef" for c in commit), (
              f"VSA commit must be a real 40-char SHA, got {commit!r}"
          )
          assert "PLACEHOLDER" not in commit.upper() and "UNAVAILABLE" not in commit.upper()
          print(f"VSA pin ok: {commit} tag={vsa.get('tag')}")
          PY
      - name: PF runtime proof
        env:
          PF_CORE_REPO_PATH: ${{ env.PF_CORE_REPO_PATH || vars.PF_CORE_REPO_PATH }}
        run: |
          if [ -n "${PF_CORE_REPO_PATH:-}" ]; then
            python scripts/demo_pf_runtime_proof.py
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "FAIL: PF_CORE_REPO_PATH required on release tags"
            exit 1
          elif [ -n "${{ vars.PF_CORE_REPO_PATH }}" ]; then
            echo "FAIL: PF_CORE_REPO_PATH var set but clone/path missing"
            exit 1
          else
            echo "PF_CORE_REPO_PATH not configured; optional on PR without sibling vars"
          fi
      - name: PCS-Core live ingest
        env:
          PCS_CORE_REPO_PATH: ${{ env.PCS_CORE_REPO_PATH || vars.PCS_CORE_REPO_PATH }}
        run: |
          if [ -n "${PCS_CORE_REPO_PATH:-}" ]; then
            pytest tests/contracts/test_pcs_core_live_ingest.py -v -m integration
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "FAIL: PCS_CORE_REPO_PATH required on release tags"
            exit 1
          elif [ -n "${{ vars.PCS_CORE_REPO_PATH }}" ]; then
            echo "FAIL: PCS_CORE_REPO_PATH var set but clone/path missing"
            exit 1
          else
            pytest tests/contracts/test_pcs_core_live_ingest.py -v
          fi
      - name: PCS-Bench external harness
        env:
          PCS_BENCH_REPO_PATH: ${{ env.PCS_BENCH_REPO_PATH || vars.PCS_BENCH_REPO_PATH }}
        run: |
          if [ -n "${PCS_BENCH_REPO_PATH:-}" ]; then
            python -m adapters.pcs_bench.external_harness
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "FAIL: PCS_BENCH_REPO_PATH required on release tags"
            exit 1
          elif [ -n "${{ vars.PCS_BENCH_REPO_PATH }}" ]; then
            echo "FAIL: PCS_BENCH_REPO_PATH var set but clone/path missing"
            exit 1
          else
            echo "PCS_BENCH_REPO_PATH not configured; skipping external harness"
          fi
      - name: VSA contract validation
        env:
          VSA_REPO_PATH: ${{ env.VSA_REPO_PATH || vars.VSA_REPO_PATH }}
        run: |
          if [ -n "${VSA_REPO_PATH:-}" ]; then
            pytest tests/contracts/test_vsa_live_contract.py -v -m integration
            python -c "
          import json
          from pathlib import Path
          from tests.contracts.cross_repo_helpers import validate_vsa_report_live
          pilot = Path('dist/pilot_bundle/00_vsa_report.json')
          if pilot.is_file():
              report = json.loads(pilot.read_text(encoding='utf-8'))
              skip = validate_vsa_report_live(report)
              assert skip is None, skip
          "
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "FAIL: VSA_REPO_PATH required on release tags (clone for live contract + SHA match)"
            exit 1
          elif [ -n "${{ vars.VSA_REPO_PATH }}" ]; then
            echo "FAIL: VSA_REPO_PATH var set but clone/path missing"
            exit 1
          else
            echo "VSA_REPO_PATH not configured; skipping VSA live validation"
          fi
      - name: Scientific Memory round-trip
        env:
          MEMORY_REPO_PATH: ${{ env.MEMORY_REPO_PATH || vars.MEMORY_REPO_PATH }}
        run: |
          if [ -n "${MEMORY_REPO_PATH:-}" ]; then
            pytest tests/contracts/test_scientific_memory_roundtrip.py -v -m integration
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "FAIL: MEMORY_REPO_PATH required on release tags"
            exit 1
          elif [ -n "${{ vars.MEMORY_REPO_PATH }}" ]; then
            echo "FAIL: MEMORY_REPO_PATH var set but clone/path missing"
            exit 1
          else
            echo "MEMORY_REPO_PATH not configured; skipping memory round-trip"
          fi
      - name: Release evidence (sibling matrix)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python scripts/build_release_evidence_report.py --out dist/release_evidence.json
      - name: Upload release evidence
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-evidence
          path: dist/release_evidence.json

  eval-bench-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,security]"
      - name: AKTA-Bench v1 eval suite
        run: make eval-bench-v1
