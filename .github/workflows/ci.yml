name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,security]"

      - name: Shared contract drift gate
        run: python scripts/assert_shared_contract_drift.py

      - name: Ruff (P1-B fail-closed on security paths)
        run: |
          ruff check \
            akta/scope_grant_verifier.py \
            akta/trust_store.py \
            akta/shared_contracts.py \
            akta/capability_envelope.py \
            akta/policy_integrity.py \
            akta/review_decision.py \
            akta/release_pins.py \
            akta/pilot_workflow.py \
            tests/test_grant_forgery_lifecycle.py \
            tests/test_shared_contract_drift.py \
            tests/test_institutional_trust_store.py \
            scripts/assert_shared_contract_drift.py

      - name: Ruff (akta package fail-closed)
        run: ruff check akta --ignore E501

      - name: Ruff (adapters/tests progressive fail-closed after autofix surface)
        run: |
          ruff check adapters/generic_rest tests/test_rest_api.py tests/test_rest_institutional.py \
            tests/test_release_pins.py tests/test_pilot_workflow.py tests/test_empirical_impact.py \
            --ignore E501

      - name: Mypy (security-critical modules fail-closed)
        run: |
          mypy \
            akta/scope_grant_verifier.py \
            akta/trust_store.py \
            akta/shared_contracts.py \
            akta/capability_envelope.py \
            akta/policy_integrity.py \
            akta/release_pins.py \
            akta/pilot_workflow.py \
            adapters/generic_rest/identity.py \
            adapters/generic_rest/persistence.py \
            --ignore-missing-imports

      - name: pip-audit (fail-closed on declared deps)
        run: |
          python - <<'PY'
          import pathlib
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib  # type: ignore
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = list(data["project"]["dependencies"])
          for extra in ("dev", "security"):
              deps.extend(data["project"].get("optional-dependencies", {}).get(extra, []))
          pathlib.Path("requirements-audit.txt").write_text("\n".join(deps) + "\n", encoding="utf-8")
          PY
          pip-audit -r requirements-audit.txt --progress-spinner off

      - name: Grant forgery lifecycle tests
        run: pytest tests/test_grant_forgery_lifecycle.py tests/test_institutional_trust_store.py -v

      - name: Run pytest
        run: pytest tests/ skills/akta-scientific-action-admissibility/tests/ -v

      - name: Run integration and contract tests
        run: pytest tests/integration/ tests/contracts/ -v

      - name: Validate JSON schemas
        run: pytest tests/test_schemas.py -v

      - name: Policy manifest / integrity tests
        run: pytest tests/test_policy_integrity_v05.py tests/test_policy_signing_modes.py -v

      - name: Empirical dry-run (no empirical completion claim)
        run: python -m evals.empirical_impact --dry-run --write-protocol

      - name: Institutional release pins unit gate
        run: pytest tests/test_release_pins.py tests/test_pilot_workflow.py -v

      - name: Run canonical scenario eval
        run: |
          akta eval \
            --scenarios scenarios/canonical_5.jsonl \
            --expected scenarios/expected_decisions.jsonl \
            --out evals/reports/canonical_5.json

      - name: Run public_100 scenario eval
        run: |
          akta eval \
            --scenarios scenarios/public_100.jsonl \
            --expected scenarios/expected_decisions.jsonl \
            --out evals/reports/public_100.json

      - name: Run oracle-independent eval
        run: python evals/run_oracle_independent.py --out evals/reports/oracle_independent.json

      - name: Run holdout private eval
        run: python evals/run_holdout_eval.py --out evals/reports/holdout_private.json

      - name: Run adversarial transition eval (v0.6)
        run: python evals/adversarial_transitions.py --out evals/reports/adversarial_transitions.json

      - name: Invalid fixtures must fail
        run: pytest tests/test_invalid_cases.py -v

      - name: Run integrated weak-evidence demo
        run: python scripts/demo_integrated_weak_evidence.py

      - name: Run integrated protocol-drift demo
        run: python scripts/demo_akta_scope_protocol_drift.py

      - name: Run reconstructable experiment demo
        run: python scripts/demo_reconstructable_experiment.py

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: eval-reports-py${{ matrix.python-version }}
          path: evals/reports/

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install -e ".[dev,security]"
      - name: Shared contract drift gate
        run: python scripts/assert_shared_contract_drift.py
      - name: Build wheel and sdist
        run: python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/akta-wheel-smoke
          /tmp/akta-wheel-smoke/bin/pip install dist/*.whl
          /tmp/akta-wheel-smoke/bin/python -c "import akta; from akta.trust_store import resolve_trust_store; print('ok', akta.__name__)"
      - name: SBOM (CycloneDX when available)
        run: |
          pip install cyclonedx-bom >/dev/null 2>&1 || true
          if command -v cyclonedx-py >/dev/null 2>&1; then
            cyclonedx-py environment -o dist/akta.cdx.json || cyclonedx-py pyproject -o dist/akta.cdx.json
          else
            python - <<'PY'
          import json, pathlib
          # Minimal fallback SBOM stub when cyclonedx tooling unavailable.
          pathlib.Path("dist").mkdir(exist_ok=True)
          pathlib.Path("dist/akta.sbom.stub.json").write_text(
              json.dumps({
                  "bomFormat": "CycloneDX",
                  "specVersion": "1.5",
                  "version": 1,
                  "metadata": {"component": {"type": "library", "name": "akta-protocol", "version": "1.0.0"}},
                  "note": "stub SBOM — install cyclonedx-bom for full generation",
              }, indent=2),
              encoding="utf-8",
          )
          print("wrote stub SBOM")
          PY
          fi
      - name: Reproducibility comparison (second build hash)
        run: |
          python -m build -o dist-repro
          python - <<'PY'
          import hashlib, pathlib, sys
          def digest(pattern):
              paths = sorted(pathlib.Path('.').glob(pattern))
              h = hashlib.sha256()
              for p in paths:
                  if p.suffix == '.whl':
                      h.update(p.read_bytes())
              return h.hexdigest(), [str(p) for p in paths if p.suffix == '.whl']
          a, pa = digest('dist/*.whl')
          b, pb = digest('dist-repro/*.whl')
          print({'dist': pa, 'dist_repro': pb, 'sha256_dist': a, 'sha256_repro': b, 'match': a == b})
          # Record comparison; do not fail CI on non-bit-identical wheels (setuptools metadata).
          pathlib.Path('dist/reproducibility.json').write_text(
              __import__('json').dumps({'sha256_dist': a, 'sha256_repro': b, 'match': a == b}, indent=2),
              encoding='utf-8',
          )
          PY
      - name: Upload package artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: akta-packages
          path: |
            dist/
            dist-repro/
      - name: pip-audit (fail-closed on declared deps)
        run: |
          python - <<'PY'
          import pathlib
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib  # type: ignore
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          deps = list(data["project"]["dependencies"])
          for extra in ("dev", "security"):
              deps.extend(data["project"].get("optional-dependencies", {}).get(extra, []))
          pathlib.Path("requirements-audit.txt").write_text("\n".join(deps) + "\n", encoding="utf-8")
          PY
          pip-audit -r requirements-audit.txt --progress-spinner off

  cross-repo-pf-pcs:
    runs-on: ubuntu-latest
    if: ${{ vars.PF_CORE_REPO_PATH != '' || vars.PCS_CORE_REPO_PATH != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,security]"
      - name: Cross-repo PF-Core validation
        if: ${{ vars.PF_CORE_REPO_PATH != '' }}
        env:
          PF_CORE_REPO_PATH: ${{ vars.PF_CORE_REPO_PATH }}
        run: pytest tests/contracts/test_cross_repo_live.py::test_pf_core_live_validation -v -m integration
      - name: Cross-repo PCS-Core validation
        if: ${{ vars.PCS_CORE_REPO_PATH != '' }}
        env:
          PCS_CORE_REPO_PATH: ${{ vars.PCS_CORE_REPO_PATH }}
        run: pytest tests/contracts/test_cross_repo_live.py::test_pcs_core_live_validation -v -m integration

  cross-repo-scope:
    runs-on: ubuntu-latest
    if: ${{ vars.SCOPE_REPO_PATH != '' || secrets.SCOPE_REPO_URL != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,security]"
      - name: Optional SCOPE sibling checkout
        if: ${{ secrets.SCOPE_REPO_URL != '' }}
        env:
          SCOPE_REPO_URL: ${{ secrets.SCOPE_REPO_URL }}
        run: |
          git clone --depth 1 "$SCOPE_REPO_URL" scope-sibling
          echo "SCOPE_REPO_PATH=$GITHUB_WORKSPACE/scope-sibling" >> $GITHUB_ENV
      - name: SCOPE live contract tests
        env:
          SCOPE_REPO_PATH: ${{ env.SCOPE_REPO_PATH || vars.SCOPE_REPO_PATH }}
        run: pytest tests/contracts/test_scope_python_import_live_shape.py -v -m integration

  cross-repo-pcs-bench:
    runs-on: ubuntu-latest
    if: ${{ vars.PCS_BENCH_REPO_PATH != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,security]"
      - name: PCS-Bench external integration contract
        env:
          PCS_BENCH_REPO_PATH: ${{ vars.PCS_BENCH_REPO_PATH }}
        run: pytest tests/contracts/test_pcs_bench_external.py -v
